<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Presentation</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

       header {
        text-align: center;
        padding: 3rem 1rem 2rem;
    }

    h1 {
        color: #F47B20;
        font-size: clamp(2.5rem, 6vw, 4rem);
        margin-bottom: 0.5rem;
    }

    .subtitle {
        max-width: 700px;
        margin: 0 auto;
        color: #F7F7F5;
        opacity: 0.9;
    }

    body {
        background: #353840;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: #F7F7F5;
    }

    .container {
    width: min(95vw, 1400px);
    margin: 0 auto;
    padding-top: 2rem;
    }

    .video-wrapper {
        width: min(95vw, 1400px);
    }

    video {
        width: 100%;
        height: auto;
        display: block;
        background: #353840;
        border-radius: 8px;
    }
        footer {
        text-align: center;
        padding: 2rem;
        color: #F7F7F5;
        opacity: 0.7;
    }


</style>
</head>
<body class="container">

<header>
    <h1>Pleistocene Educational Webinar</h1>
    <p class="subtitle">
        Proposed educational webinar designs for the Bristol Museum & Art Gallery
        Pleistocene exhibit redesign.
    </p>
</header>

<div class="video-wrapper">
    <video id="video" controls>
        <source src="bee.mp4" type="video/mp4">
        Your browser does not support HTML5 video playback.
    </video>
</div>

<script>
function openFullscreen() {
    const video = document.getElementById("video");

    if (video.requestFullscreen) {
        video.requestFullscreen();
    } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
    }
}

document.addEventListener("keydown", function(event) {
    const video = document.getElementById("video");

    if (event.code === "Space") {
        event.preventDefault();

        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    }
});
</script>

<footer>
    Pleistocene Exhibit Redesign Project
</footer>

</body>
</html>
